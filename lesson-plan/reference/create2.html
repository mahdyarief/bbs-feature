		dataMap={}
		if($(this).attr('refresh') == 1){
	        $.post('list_HBLresources.php', dataMap, function(data){
	        	$('#ls_hbl_resources').html(data);
	        })
	        $('#browse_hbl_resources').removeAttr('refresh')
			$('#browse_hbl_resources').attr('refresh', 0)
		}
	})
	$(document).on('click', '[id=check_hbl_resources]', function(){
		//check check or uncheck
		if($(this).prop("checked") == true){
            //console.log("Checkbox is checked.");
			$('#browse_hbl_resources').show()
        }
        else if($(this).prop("checked") == false){
            //console.log("Checkbox is unchecked.");
			$('#browse_hbl_resources').hide()
            return;
        }
	})
</script>

</body></html>
